<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF099"/>
      <stop offset="35%" stop-color="#E5B83B"/>
      <stop offset="70%" stop-color="#C69214"/>
      <stop offset="100%" stop-color="#996E08"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1c1a17"/>
      <stop offset="70%" stop-color="#0e0d0c"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#C69214" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>

  <!-- Outer Geometric Gold Border -->
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.75"/>
  <rect x="36" y="36" width="440" height="440" rx="70" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="8 6"/>

  <!-- Center Shield / Crest -->
  <g filter="url(#glow)">
    <!-- Decorative Crown / Star Top -->
    <path d="M226 130 L256 95 L286 130 L320 115 L300 155 L212 155 L192 115 Z" fill="url(#goldGrad)"/>
    <circle cx="256" cy="85" r="5" fill="url(#goldGrad)"/>
    <circle cx="226" cy="115" r="4" fill="url(#goldGrad)"/>
    <circle cx="286" cy="115" r="4" fill="url(#goldGrad)"/>

    <!-- Barber Scissors & Comb Icon Graphic -->
    <g transform="translate(256, 215) scale(0.95)" stroke="url(#goldGrad)" stroke-width="6" fill="none" stroke-linecap="round">
      <!-- Scissors Blade 1 -->
      <line x1="-50" y1="-50" x2="50" y2="50" />
      <circle cx="-55" cy="-55" r="16" stroke-width="5" />
      <!-- Scissors Blade 2 -->
      <line x1="50" y1="-50" x2="-50" y2="50" />
      <circle cx="55" cy="-55" r="16" stroke-width="5" />
      <!-- Center Pivot Pin -->
      <circle cx="0" cy="0" r="6" fill="url(#goldGrad)" stroke="none"/>
    </g>

    <!-- Stylized "VJ" Monogram -->
    <text x="256" y="325" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="74" font-weight="900" text-anchor="middle" fill="url(#goldGrad)" letter-spacing="6">
      VJ
    </text>

    <!-- Subtitle SALON -->
    <text x="256" y="365" font-family="'Montserrat', sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#FFFFFF" letter-spacing="12">
      SALON
    </text>

    <!-- Established / Barber Tag -->
    <text x="256" y="395" font-family="'Montserrat', sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="url(#goldGrad)" letter-spacing="5">
      PREMIUM GROOMING
    </text>

    <!-- Decorative Bottom Ribbon Line -->
    <path d="M160 415 L256 422 L352 415" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" fill="none"/>
    <polygon points="256,420 252,425 260,425" fill="url(#goldGrad)"/>
  </g>
</svg>
